{% extends 'catalog/base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">{% if request.path == '/users/register/' %}Регистрация{% else %}Вход{% endif %}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    {% if request.path == '/users/register/' %}Зарегистрироваться{% else %}Войти{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
