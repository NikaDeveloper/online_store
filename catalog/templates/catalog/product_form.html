{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        {% if object %}
                            Редактировать продукт
                        {% else %}
                            Создать новый продукт
                        {% endif %}
                    </h3>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary mt-3">
                            {% if object %}
                                Сохранить изменения
                            {% else %}
                                Создать
                            {% endif %}
                        </button>
                        <a href="{% url 'catalog:home' %}" class="btn btn-secondary mt-3">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
