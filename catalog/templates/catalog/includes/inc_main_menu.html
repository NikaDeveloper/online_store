<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>

    <nav class="my-2 my-md-0 me-md-3">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:list' %}">Блог</a>
    </nav>

    <nav>
        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-info" href="{% url 'users:profile_update' %}">
                Профиль
            </a>
            <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
    {% csrf_token %}
    <button type="submit" class="p-2 btn btn-outline-secondary">
        Выход
    </button>
</form>
        {% else %}
            <a class="p-2 btn btn-outline-success" href="{% url 'users:login' %}">
                Вход
            </a>
            <a class="p-2 btn btn-outline-warning" href="{% url 'users:register' %}">
                Регистрация
            </a>
        {% endif %}
    </nav>
</div>
